#=============================================================
# bookkeepingWhiz 线上站点配置
# 域名：your-domain.com（80 自动重定向 443，整站反代 RuoYi 后端）
#
# 用法：
#   1. 上传覆盖服务器上的 /etc/nginx/conf.d/bookkeeping.conf
#   2. 证书放 /etc/nginx/cert/ 下（阿里云免费证书，下载 Nginx 格式）
#   3. nginx -t && nginx -s reload
#=============================================================

#---------------- HTTP : 80 → HTTPS : 443 ----------------
server {
    listen 80;
    listen [::]:80;
    # 裸域名与 www 一并接收，统一跳到 https://www
    server_name your-domain.com your-domain.com;

    # ACME 证书自动续期验证路径（certbot / acme.sh 使用），保持不被重定向
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余请求全部 301 到 HTTPS
    location / {
        return 301 https://your-domain.com$request_uri;
    }
}

#---------------- HTTPS : 443 ----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    # 证书：阿里云免费证书（Nginx 格式），申请时绑定域名填 your-domain.com
    ssl_certificate     /etc/nginx/cert/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/cert/your-domain.com.key;

    # TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 上传上限：头像 / 支付凭证截图
    client_max_body_size 20m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API 返回 JSON 压缩
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1k;

    # 整站反代到 RuoYi 后端（小程序与管理端 API 均走这里）
    location / {
        proxy_pass http://127.0.0.1:9066;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
